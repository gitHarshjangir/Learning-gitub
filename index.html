<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevPulse - Modern Tech Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">⚡ DevPulse</div>
    <nav>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main class="hero">
    <h1>Welcome to the Ultimate <span class="highlight">DevPulse Community</span></h1>
    <p>Hum real-time website project ke sath Git master kar rahe hain!</p>
    <button class="btn">Explore Now 🚀</button>
  </main>

  <!-- Contact Section -->
  <section class="contact-section" id="contact" style="max-width: 600px; margin: 3rem auto; padding: 1.5rem; background: #1e293b; border-radius: 8px;">
    <h2>📬 Contact Us</h2>
    <form style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem;">
      <input type="text" placeholder="Your Name" style="padding: 0.6rem; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: #fff;">
      <input type="email" placeholder="Your Email" style="padding: 0.6rem; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: #fff;">
      <textarea placeholder="Your Message" rows="3" style="padding: 0.6rem; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: #fff;"></textarea>
      <button type="button" class="btn">Send Message ✨</button>
    </form>
  </section>
</body>
</html>
